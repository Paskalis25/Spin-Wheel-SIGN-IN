<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spin Challenge Panitia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <p class="header__eyebrow">Panitia only</p>
      <h1 class="header__title">Spin Challenge</h1>
      <p class="header__subtitle">
        Pilih namamu di bawah, lalu tekan roll. Satu dari tiga challenge
        bakal kepilih buat kamu jalanin.
      </p>
    </header>

    <p class="roster-label">Pilih namamu</p>
    <div class="picker">
      <div class="picker__field">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Ketik nama..."
          role="combobox"
          aria-expanded="false"
          aria-controls="dropdown-list"
          aria-autocomplete="list"
          autocomplete="off"
        />
        <svg class="picker__chevron" id="picker-chevron" width="14" height="9" viewBox="0 0 14 9" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M1 1L7 7L13 1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <ul class="dropdown" id="dropdown-list" role="listbox" hidden></ul>
    </div>

    <p class="empty-state" id="empty-state">Belum ada nama yang dipilih.</p>

    <section class="panel" id="panel" hidden></section>

    <section class="history-section">
      <div class="history-header">
        <h2 class="history-title">Histori Roll</h2>
        <button type="button" class="history-clear-btn" id="clear-history-btn" hidden>Hapus Semua</button>
      </div>
      <p class="history-empty" id="history-empty">Belum ada histori roll di device ini.</p>
      <ul class="history-list" id="history-list"></ul>
    </section>

    <footer class="footer">Dibuat untuk keperluan internal panitia.</footer>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
